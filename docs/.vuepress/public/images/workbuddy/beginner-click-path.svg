<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">WorkBuddy 小白四步操作路径</title>
  <desc id="desc">从新建任务、选择日常办公和 Craft，到输入目标并检查结果的四步教学路径。</desc>
  <rect width="1200" height="500" rx="28" fill="#f7faff"/>
  <text x="56" y="62" font-family="Arial,'PingFang SC',sans-serif" font-size="27" font-weight="700" fill="#14213d">小白只记 4 步：新建 → 选择 → 描述 → 检查</text>
  <text x="56" y="94" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#5f6f89">先用低风险材料练习，不需要一次学会全部菜单</text>
  <g font-family="Arial,'PingFang SC',sans-serif">
    <g><rect x="54" y="150" width="246" height="250" rx="22" fill="#fff" stroke="#cfe0ff" stroke-width="3"/><circle cx="104" cy="198" r="24" fill="#1769ff"/><text x="104" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text><text x="144" y="204" font-size="22" font-weight="700" fill="#1769ff">新建任务</text><rect x="82" y="244" width="190" height="48" rx="10" fill="#eef5ff"/><text x="177" y="275" text-anchor="middle" font-size="16" fill="#244572">＋ 新建任务</text><text x="82" y="330" font-size="15" fill="#5f6f89">任务名：周会纪要</text><text x="82" y="356" font-size="15" fill="#5f6f89">不要把不同事情混在一起</text></g>
    <g><rect x="326" y="150" width="246" height="250" rx="22" fill="#eaf2ff" stroke="#8fb5ff" stroke-width="3"/><circle cx="376" cy="198" r="24" fill="#1769ff"/><text x="376" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text><text x="416" y="204" font-size="22" font-weight="700" fill="#1769ff">选工作方式</text><rect x="354" y="244" width="190" height="48" rx="10" fill="#fff"/><text x="449" y="275" text-anchor="middle" font-size="16" fill="#244572">日常办公 · Craft</text><text x="354" y="330" font-size="15" fill="#5f6f89">明确任务先直接做</text><text x="354" y="356" font-size="15" fill="#5f6f89">复杂任务再选 Plan</text></g>
    <g><rect x="598" y="150" width="246" height="250" rx="22" fill="#fff" stroke="#cfe0ff" stroke-width="3"/><circle cx="648" cy="198" r="24" fill="#1769ff"/><text x="648" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text><text x="688" y="204" font-size="22" font-weight="700" fill="#1769ff">说清目标</text><rect x="626" y="244" width="190" height="48" rx="10" fill="#eef5ff"/><text x="721" y="275" text-anchor="middle" font-size="15" fill="#244572">目标 + 材料 + 格式</text><text x="626" y="330" font-size="15" fill="#5f6f89">缺少信息就写“待确认”</text><text x="626" y="356" font-size="15" fill="#5f6f89">需要文件就用 @ 引用</text></g>
    <g><rect x="870" y="150" width="276" height="250" rx="22" fill="#fff" stroke="#cfe0ff" stroke-width="3"/><circle cx="920" cy="198" r="24" fill="#1769ff"/><text x="920" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text><text x="960" y="204" font-size="22" font-weight="700" fill="#1769ff">检查结果</text><rect x="898" y="244" width="220" height="48" rx="10" fill="#e8f1ff"/><text x="1008" y="275" text-anchor="middle" font-size="15" fill="#244572">看产物 · 抽查 · 再交付</text><text x="898" y="330" font-size="15" fill="#5f6f89">事实对不对？格式能不能用？</text><text x="898" y="356" font-size="15" fill="#5f6f89">外发、写入前先人工确认</text></g>
  </g>
  <g stroke="#1769ff" stroke-width="4" fill="none"><path d="M300 275H316" marker-end="url(#arrow)"/><path d="M572 275H588" marker-end="url(#arrow)"/><path d="M844 275H860" marker-end="url(#arrow)"/></g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#1769ff"/></marker></defs>
</svg>
