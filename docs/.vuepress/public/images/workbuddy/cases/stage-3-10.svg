<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">案例 3-10：上线前：隐私、日志、回滚</title><desc id="desc">四步原创教学示意图：删掉敏感资料、保留运行记录、准备撤回方案、再公开入口</desc><rect width="1200" height="430" rx="28" fill="#f7faff"/><text x="55" y="70" font-size="20" font-weight="800" fill="#1769ff">WORKBUDDY GUIDE · 案例 10</text><text x="55" y="120" font-size="34" font-weight="800" fill="#14213d">上线前：隐私、日志、回滚</text><text x="55" y="151" font-size="16" fill="#657896">看图走四步：不用背术语，先完成眼前这一件小事。</text><g><rect x="55" y="180" width="230" height="145" rx="18" fill="#ffffff" stroke="#dbe7f7" stroke-width="3"/><circle cx="89" cy="214" r="20" fill="#1769ff"/><text x="89" y="221" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">1</text><text x="79" y="265" font-size="23" font-weight="700" fill="#18345c">删掉敏感资料</text><text x="79" y="297" font-size="15" fill="#657896">先做这一小步</text></g><path d="M297 252 H323" stroke="#8fb5ff" stroke-width="4" stroke-linecap="round"/><path d="M313 242 L325 252 L313 262" fill="none" stroke="#8fb5ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="335" y="180" width="230" height="145" rx="18" fill="#ffffff" stroke="#dbe7f7" stroke-width="3"/><circle cx="369" cy="214" r="20" fill="#2f7bff"/><text x="369" y="221" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">2</text><text x="359" y="265" font-size="23" font-weight="700" fill="#18345c">保留运行记录</text><text x="359" y="297" font-size="15" fill="#657896">不用一次全懂</text></g><path d="M577 252 H603" stroke="#8fb5ff" stroke-width="4" stroke-linecap="round"/><path d="M593 242 L605 252 L593 262" fill="none" stroke="#8fb5ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="615" y="180" width="230" height="145" rx="18" fill="#e8f1ff" stroke="#1769ff" stroke-width="3"/><circle cx="649" cy="214" r="20" fill="#5a91ff"/><text x="649" y="221" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text><text x="639" y="265" font-size="23" font-weight="700" fill="#18345c">准备撤回方案</text><text x="639" y="297" font-size="15" fill="#657896">看到结果再调整</text></g><path d="M857 252 H883" stroke="#8fb5ff" stroke-width="4" stroke-linecap="round"/><path d="M873 242 L885 252 L873 262" fill="none" stroke="#8fb5ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="895" y="180" width="230" height="145" rx="18" fill="#ffffff" stroke="#dbe7f7" stroke-width="3"/><circle cx="929" cy="214" r="20" fill="#7aa8ff"/><text x="929" y="221" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">4</text><text x="919" y="265" font-size="23" font-weight="700" fill="#18345c">再公开入口</text><text x="919" y="297" font-size="15" fill="#657896">做完记得检查</text></g></svg>