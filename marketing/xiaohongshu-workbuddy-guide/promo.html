<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WorkBuddy Guide｜小红书轮播图</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 1706px; margin: 0; overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .poster { position: relative; width: 1280px; height: 1706px; overflow: hidden; padding: 64px 76px; color: #10203e; background: radial-gradient(circle at 94% 8%, rgba(110, 169, 255, .34), transparent 27%), linear-gradient(145deg, #f9fcff 0%, #edf5ff 100%); }
      .poster.dark { color: #f2f7ff; background: radial-gradient(circle at 88% 7%, rgba(73, 133, 255, .32), transparent 27%), linear-gradient(145deg, #091323 0%, #111f39 100%); }
      .poster::before { content: ""; position: absolute; inset: 0; opacity: .42; background-image: linear-gradient(rgba(59, 119, 221, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(59, 119, 221, .08) 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(to bottom, black, transparent 78%); pointer-events: none; }
      .poster.dark::before { opacity: .52; background-image: linear-gradient(rgba(139, 184, 255, .10) 1px, transparent 1px), linear-gradient(90deg, rgba(139, 184, 255, .10) 1px, transparent 1px); }
      .brand, .headline, .features, .shot-shell, .footer { position: relative; z-index: 1; }
      .brand { display: flex; align-items: center; justify-content: space-between; }
      .brand-left { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 850; letter-spacing: .02em; }
      .mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: linear-gradient(145deg, #1a61ec, #5798ff); color: white; font-size: 25px; font-weight: 900; box-shadow: 0 10px 22px rgba(25, 102, 255, .28); }
      .page { padding: 9px 14px; border: 1px solid rgba(66, 121, 217, .20); border-radius: 999px; background: rgba(255,255,255,.60); color: #3564ac; font-size: 16px; font-weight: 800; letter-spacing: .08em; }
      .dark .page { border-color: rgba(162, 198, 255, .24); background: rgba(17, 38, 73, .76); color: #a8c9ff; }
      .headline { margin-top: 74px; }
      .kicker { margin: 0 0 18px; color: #2d72e9; font-size: 20px; font-weight: 850; letter-spacing: .11em; }
      .dark .kicker { color: #88b7ff; }
      h1 { max-width: 930px; margin: 0; font-size: 72px; line-height: 1.13; letter-spacing: -.055em; }
      .accent { color: #1769ff; }
      .dark .accent { color: #71a4ff; }
      .lead { max-width: 900px; margin: 26px 0 0; color: #566a89; font-size: 27px; font-weight: 500; line-height: 1.55; }
      .dark .lead { color: #b6c8e5; }
      .features { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      .feature { padding: 10px 15px; border: 1px solid #c7ddff; border-radius: 999px; background: rgba(255,255,255,.76); color: #315f9f; font-size: 17px; font-weight: 800; }
      .dark .feature { border-color: rgba(143, 188, 255, .32); background: rgba(24, 52, 97, .70); color: #b9d5ff; }
      .shot-shell { margin-top: 48px; overflow: hidden; border: 1px solid rgba(91, 141, 226, .30); border-radius: 28px; background: white; box-shadow: 0 32px 70px rgba(34, 78, 151, .20), 0 4px 0 rgba(255,255,255,.7) inset; }
      .dark .shot-shell { border-color: rgba(155, 195, 255, .26); background: #0c182c; box-shadow: 0 32px 70px rgba(0,0,0,.35), 0 4px 0 rgba(255,255,255,.06) inset; }
      .shot-shell::before { content: "真实网站界面 · WorkBuddy Guide"; display: block; height: 47px; padding: 13px 19px; background: linear-gradient(90deg, #eaf3ff, #f8fbff); color: #5173a5; font-size: 14px; font-weight: 800; letter-spacing: .05em; }
      .dark .shot-shell::before { background: linear-gradient(90deg, #142849, #0f1d36); color: #9fc4ff; }
      .shot { display: block; width: 100%; height: auto; }
      .footer { position: absolute; right: 76px; bottom: 64px; left: 76px; display: flex; align-items: end; justify-content: space-between; gap: 20px; padding-top: 26px; border-top: 1px solid rgba(59, 105, 178, .20); }
      .footer strong { display: block; color: #1769ff; font-size: 22px; letter-spacing: -.02em; }
      .dark .footer strong { color: #91bdff; }
      .footer span { display: block; margin-top: 7px; color: #667b9b; font-size: 15px; }
      .dark .footer span { color: #9fb2d0; }
      .url { flex: none; padding: 11px 15px; border-radius: 12px; background: #1769ff; color: white; font-size: 15px; font-weight: 800; box-shadow: 0 10px 22px rgba(23,105,255,.22); }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      const slides = [
        { tone: 'light', kicker: '给刚接触 AI 的你', title: '把 WorkBuddy<br><span class="accent">学成会交付</span>', lead: '不是一堆看完就忘的概念，而是一条从第一步走到真实工作场景的中文学习路。', features: ['小白也能跟上', '从第一个任务开始', '图文 + 视频跟练'], image: 'source-shots/01-home-light.jpg', footer: '先跑通，再变熟练', note: '从安装、菜单和第一个任务开始' },
        { tone: 'light', kicker: '不会用？先别怕', title: '三段式学习<br><span class="accent">不容易迷路</span>', lead: '认识工具 → 基本场景 → 自动化放大。每一段只解决一个小目标，学会再升级。', features: ['有顺序', '有图解', '有下一步'], image: 'source-shots/02-guide-path.jpg', footer: '复杂工具，也能慢慢学会', note: '看见路径，就知道下一步做什么' },
        { tone: 'light', kicker: '不知道从哪一个任务开始？', title: '30 个案例<br><span class="accent">直接照着做</span>', lead: '工作、学习、生活、创意都有可跟做的案例。先完成一个小成果，再复制到自己的任务里。', features: ['10 个入门案例', '10 个日常场景', '10 个进阶案例'], image: 'source-shots/03-cases.jpg', footer: '不会空谈，只带你动手', note: '每个案例都有清晰的开始位置' },
        { tone: 'light', kicker: '不只是告诉你“该点哪里”', title: '把桌面、任务与产物<br><span class="accent">一次看懂</span>', lead: '用界面示意图拆开任务区、对话过程和交付检查，让第一次上手不再发懵。', features: ['界面图解', '操作顺序', '真实任务思路'], image: 'source-shots/04-operation-guide.jpg', footer: '看明白，才敢开始用', note: '把复杂界面翻译成大白话' },
        { tone: 'dark', kicker: '夜晚也能舒服地学', title: '全站白天 / 夜晚<br><span class="accent">一键切换</span>', lead: '首页、文章、侧栏、表格、案例卡片都会一起切换。白天清爽，夜晚沉浸。', features: ['全站同步', '手机也可切换', '长时间阅读更舒服'], image: 'source-shots/05-home-dark.jpg', footer: '现在，就从第 1 段开始', note: 'workbuddy-guide.onrender.com' }
      ];
      const index = Math.max(0, Math.min(slides.length - 1, Number(new URLSearchParams(location.search).get('slide') || 1) - 1));
      const slide = slides[index];
      document.getElementById('app').innerHTML = `
        <section class="poster ${slide.tone}">
          <header class="brand"><div class="brand-left"><span class="mark">W</span><span>WORKBUDDY GUIDE</span></div><span class="page">0${index + 1} / 05</span></header>
          <section class="headline"><p class="kicker">${slide.kicker}</p><h1>${slide.title}</h1><p class="lead">${slide.lead}</p></section>
          <section class="features">${slide.features.map(item => `<span class="feature">${item}</span>`).join('')}</section>
          <figure class="shot-shell"><img class="shot" src="${slide.image}" alt="WorkBuddy Guide 真实网站界面截图"></figure>
          <footer class="footer"><div><strong>${slide.footer}</strong><span>${slide.note}</span></div><span class="url">workbuddy-guide.onrender.com</span></footer>
        </section>`;
    </script>
  </body>
</html>
